<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 224" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a18" />
      <stop offset="50%" stop-color="#0c1425" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="384" height="224" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="56" x2="384" y2="56" />
    <line x1="0" y1="112" x2="384" y2="112" />
    <line x1="0" y1="168" x2="384" y2="168" />
    <line x1="96" y1="0" x2="96" y2="224" />
    <line x1="192" y1="0" x2="192" y2="224" />
    <line x1="288" y1="0" x2="288" y2="224" />
  </g>

  <!-- Glowing Center Orb / Shield -->
  <circle cx="192" cy="112" r="48" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="192" cy="112" r="32" stroke="url(#accentGrad)" stroke-width="3" fill="#1e293b" />

  <!-- Thematic Icon Inside Orb (Arcade Gamepad / Gem) -->
  <path d="M182 112h20M192 102v20" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <circle cx="208" cy="106" r="3" fill="#f59e0b" />
  <circle cx="208" cy="118" r="3" fill="#ea580c" />
</svg>
