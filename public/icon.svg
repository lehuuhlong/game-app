<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Controller Body Gradient -->
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Cyan Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Amber Accent -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Ambient Light Orbs inside Icon -->
  <circle cx="140" cy="140" r="100" fill="#38bdf8" fill-opacity="0.12" />
  <circle cx="370" cy="370" r="120" fill="#f59e0b" fill-opacity="0.08" />

  <!-- Gamepad Shape with Glow -->
  <g filter="url(#glow)">
    <!-- Controller Body -->
    <path
      d="M168 184 C112 184 72 228 72 284 C72 344 116 388 162 388 C188 388 208 368 226 340 C242 316 270 316 286 340 C304 368 324 388 350 388 C396 388 440 344 440 284 C440 228 400 184 344 184 Z"
      fill="url(#padGrad)"
      stroke="url(#borderGrad)"
      stroke-width="10"
      stroke-linejoin="round"
    />

    <!-- D-Pad (Left) -->
    <!-- Horizontal bar -->
    <rect x="124" y="266" width="76" height="26" rx="7" fill="#334155" stroke="#475569" stroke-width="3" />
    <!-- Vertical bar -->
    <rect x="149" y="241" width="26" height="76" rx="7" fill="#334155" stroke="#475569" stroke-width="3" />
    <!-- Center D-pad core -->
    <rect x="149" y="266" width="26" height="26" rx="4" fill="#1e293b" />

    <!-- Action Buttons (Right) -->
    <!-- Top Button (Y - Cyan) -->
    <circle cx="350" cy="242" r="13" fill="url(#cyanGrad)" stroke="#7dd3fc" stroke-width="2" />
    <!-- Right Button (B - Amber) -->
    <circle cx="380" cy="272" r="13" fill="url(#amberGrad)" stroke="#fde68a" stroke-width="2" />
    <!-- Bottom Button (A - Emerald) -->
    <circle cx="350" cy="302" r="13" fill="#10b981" stroke="#6ee7b7" stroke-width="2" />
    <!-- Left Button (X - Rose) -->
    <circle cx="320" cy="272" r="13" fill="#f43f5e" stroke="#fda4af" stroke-width="2" />

    <!-- Center Menu Buttons / Indicator LEDs -->
    <rect x="230" y="266" width="20" height="8" rx="4" fill="#64748b" transform="rotate(-20 240 270)" />
    <rect x="262" y="266" width="20" height="8" rx="4" fill="#64748b" transform="rotate(20 272 270)" />

    <!-- Central Arcade Star Emblem -->
    <polygon points="256,220 262,234 276,234 265,243 269,257 256,248 243,257 247,243 236,234 250,234" fill="url(#amberGrad)" />
  </g>
</svg>
