<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 224" fill="none">
  <defs>
    <linearGradient id="bgChess" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldPiece" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="silverPiece" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <rect width="384" height="224" fill="url(#bgChess)" />

  <!-- Ambient Light -->
  <circle cx="192" cy="110" r="90" fill="#f59e0b" fill-opacity="0.12" />

  <!-- Isometric Board Perspective Base -->
  <g transform="translate(192, 128) scale(1, 0.58) rotate(45)">
    <!-- Board Base Shadow -->
    <rect x="-105" y="-105" width="210" height="210" rx="8" fill="#1e293b" stroke="#475569" stroke-width="6" />

    <!-- 6x6 Checkered Grid -->
    <g>
      <!-- Row 0 -->
      <rect x="-90" y="-90" width="30" height="30" fill="#f8fafc" />
      <rect x="-60" y="-90" width="30" height="30" fill="#334155" />
      <rect x="-30" y="-90" width="30" height="30" fill="#f8fafc" />
      <rect x="0" y="-90" width="30" height="30" fill="#334155" />
      <rect x="30" y="-90" width="30" height="30" fill="#f8fafc" />
      <rect x="60" y="-90" width="30" height="30" fill="#334155" />

      <!-- Row 1 -->
      <rect x="-90" y="-60" width="30" height="30" fill="#334155" />
      <rect x="-60" y="-60" width="30" height="30" fill="#f8fafc" />
      <rect x="-30" y="-60" width="30" height="30" fill="#334155" />
      <rect x="0" y="-60" width="30" height="30" fill="#f8fafc" />
      <rect x="30" y="-60" width="30" height="30" fill="#334155" />
      <rect x="60" y="-60" width="30" height="30" fill="#f8fafc" />

      <!-- Row 2 -->
      <rect x="-90" y="-30" width="30" height="30" fill="#f8fafc" />
      <rect x="-60" y="-30" width="30" height="30" fill="#334155" />
      <rect x="-30" y="-30" width="30" height="30" fill="#38bdf8" fill-opacity="0.5" />
      <rect x="0" y="-30" width="30" height="30" fill="#334155" />
      <rect x="30" y="-30" width="30" height="30" fill="#f8fafc" />
      <rect x="60" y="-30" width="30" height="30" fill="#334155" />

      <!-- Row 3 -->
      <rect x="-90" y="0" width="30" height="30" fill="#334155" />
      <rect x="-60" y="0" width="30" height="30" fill="#f8fafc" />
      <rect x="-30" y="0" width="30" height="30" fill="#334155" />
      <rect x="0" y="0" width="30" height="30" fill="#38bdf8" fill-opacity="0.8" />
      <rect x="30" y="0" width="30" height="30" fill="#334155" />
      <rect x="60" y="0" width="30" height="30" fill="#f8fafc" />

      <!-- Row 4 -->
      <rect x="-90" y="30" width="30" height="30" fill="#f8fafc" />
      <rect x="-60" y="30" width="30" height="30" fill="#334155" />
      <rect x="-30" y="30" width="30" height="30" fill="#f8fafc" />
      <rect x="0" y="30" width="30" height="30" fill="#334155" />
      <rect x="30" y="30" width="30" height="30" fill="#f8fafc" />
      <rect x="60" y="30" width="30" height="30" fill="#334155" />

      <!-- Row 5 -->
      <rect x="-90" y="60" width="30" height="30" fill="#334155" />
      <rect x="-60" y="60" width="30" height="30" fill="#f8fafc" />
      <rect x="-30" y="60" width="30" height="30" fill="#334155" />
      <rect x="0" y="60" width="30" height="30" fill="#f8fafc" />
      <rect x="30" y="60" width="30" height="30" fill="#334155" />
      <rect x="60" y="60" width="30" height="30" fill="#f8fafc" />
    </g>
  </g>

  <!-- Chess Pieces Foreground -->
  <!-- Gold King (Center) -->
  <g transform="translate(192, 92)">
    <!-- Piece Shadow -->
    <ellipse cx="0" cy="46" rx="24" ry="10" fill="rgba(0,0,0,0.5)" />
    <!-- Cross on Crown -->
    <path d="M-3 -48 H3 V-42 H-3 Z M-8 -45 H8 V-42 H-8 Z" fill="#fde047" />
    <!-- Crown -->
    <path d="M-16 -38 C-16 -44 16 -44 16 -38 C14 -32 12 -26 14 -20 C10 -22 -10 -22 -14 -20 C-12 -26 -14 -32 -16 -38 Z" fill="url(#goldPiece)" stroke="#78350f" stroke-width="2" />
    <!-- Body -->
    <path d="M-14 -20 C-14 -10 -10 18 -18 36 H18 C10 18 14 -10 14 -20 Z" fill="url(#goldPiece)" stroke="#78350f" stroke-width="2" />
    <!-- Base Pedestal -->
    <rect x="-22" y="36" width="44" height="10" rx="3" fill="url(#goldPiece)" stroke="#78350f" stroke-width="2" />
    <!-- Highlight Shimmer -->
    <path d="M-4 -36 C-4 -15 -8 20 -12 34" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Silver Knight (Left) -->
  <g transform="translate(110, 114) scale(0.85)">
    <ellipse cx="0" cy="42" rx="20" ry="8" fill="rgba(0,0,0,0.4)" />
    <path d="M-10 -30 C-6 -36 12 -34 16 -24 C18 -18 10 -10 14 -2 C10 12 12 24 16 32 H-16 C-12 20 -16 6 -14 -10 C-18 -16 -16 -24 -10 -30 Z" fill="url(#silverPiece)" stroke="#334155" stroke-width="2" />
    <rect x="-18" y="32" width="36" height="8" rx="2" fill="url(#silverPiece)" stroke="#334155" stroke-width="2" />
    <!-- Eye & Mane -->
    <circle cx="4" cy="-22" r="2" fill="#0f172a" />
  </g>

  <!-- Silver Queen (Right) -->
  <g transform="translate(274, 114) scale(0.85)">
    <ellipse cx="0" cy="42" rx="20" ry="8" fill="rgba(0,0,0,0.4)" />
    <!-- Crown Peaks -->
    <circle cx="-14" cy="-36" r="2.5" fill="#f8fafc" />
    <circle cx="0" cy="-40" r="3" fill="#f8fafc" />
    <circle cx="14" cy="-36" r="2.5" fill="#f8fafc" />
    <path d="M-14 -34 L-10 -22 L0 -36 L10 -22 L14 -34 C12 -18 10 18 16 32 H-16 C-10 18 -12 -18 -14 -34 Z" fill="url(#silverPiece)" stroke="#334155" stroke-width="2" />
    <rect x="-18" y="32" width="36" height="8" rx="2" fill="url(#silverPiece)" stroke="#334155" stroke-width="2" />
  </g>
</svg>
