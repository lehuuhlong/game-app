<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Flappy Bird</title>
  <desc id="desc">A yellow bird flying between bright green pipes in a blue sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#15803d"/>
      <stop offset=".3" stop-color="#4ade80"/>
      <stop offset=".75" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <g fill="#fff" opacity=".68">
    <ellipse cx="140" cy="105" rx="82" ry="28"/>
    <ellipse cx="113" cy="87" rx="38" ry="31"/>
    <ellipse cx="600" cy="150" rx="95" ry="30"/>
    <ellipse cx="624" cy="125" rx="44" ry="36"/>
  </g>
  <g fill="url(#pipe)" stroke="#14532d" stroke-width="8">
    <rect x="565" y="-10" width="120" height="145"/>
    <rect x="550" y="115" width="150" height="45" rx="4"/>
    <rect x="565" y="310" width="120" height="150"/>
    <rect x="550" y="290" width="150" height="45" rx="4"/>
  </g>
  <g transform="translate(305 230) rotate(-8)" stroke="#92400e" stroke-width="7" stroke-linejoin="round">
    <ellipse rx="72" ry="53" fill="#f59e0b"/>
    <ellipse cx="-28" cy="20" rx="42" ry="27" fill="#fbbf24"/>
    <circle cx="32" cy="-22" r="24" fill="#fff"/>
    <circle cx="40" cy="-22" r="8" fill="#111827" stroke="none"/>
    <path d="M62 0l58 18-58 22z" fill="#fb7185"/>
  </g>
  <rect y="405" width="800" height="45" fill="#84cc16"/>
  <rect y="405" width="800" height="12" fill="#d9f99d"/>
</svg>
