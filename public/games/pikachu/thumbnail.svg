<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 224" fill="none">
  <defs>
    <linearGradient id="bgPikachu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a18" />
      <stop offset="50%" stop-color="#181303" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="tileYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="tileBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="tileRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="lightning" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="384" height="224" fill="url(#bgPikachu)" />

  <!-- Ambient Glow -->
  <circle cx="90" cy="112" r="80" fill="#facc15" fill-opacity="0.18" />
  <circle cx="290" cy="112" r="80" fill="#38bdf8" fill-opacity="0.16" />
  <circle cx="192" cy="112" r="90" fill="#f59e0b" fill-opacity="0.1" />

  <!-- Subtle Board Grid Frame -->
  <rect x="36" y="24" width="312" height="176" rx="20" fill="#111827" fill-opacity="0.8" stroke="#1e293b" stroke-width="2" />

  <!-- Background Tiles Grid Outline -->
  <rect x="56" y="44" width="52" height="52" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />
  <rect x="56" y="106" width="52" height="52" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />
  <rect x="276" y="44" width="52" height="52" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />
  <rect x="276" y="106" width="52" height="52" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />

  <!-- Matched Pair 1 (Pikachu Left) -->
  <g transform="translate(120, 52)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="#1e293b" stroke="#facc15" stroke-width="2.5" filter="url(#glow-filter)" />
    <text x="30" y="38" font-size="28" text-anchor="middle" dominant-baseline="middle">⚡</text>
  </g>

  <!-- Matched Pair 2 (Pikachu Right - Below) -->
  <g transform="translate(204, 114)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="#1e293b" stroke="#facc15" stroke-width="2.5" filter="url(#glow-filter)" />
    <text x="30" y="38" font-size="28" text-anchor="middle" dominant-baseline="middle">⚡</text>
  </g>

  <!-- Supporting Pair 1: Fire -->
  <g transform="translate(120, 124)">
    <rect x="0" y="0" width="50" height="50" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="1.5" />
    <text x="25" y="32" font-size="22" text-anchor="middle" dominant-baseline="middle">🔥</text>
  </g>

  <!-- Supporting Pair 2: Water -->
  <g transform="translate(214, 52)">
    <rect x="0" y="0" width="50" height="50" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="25" y="32" font-size="22" text-anchor="middle" dominant-baseline="middle">💧</text>
  </g>

  <!-- The 2-bend Electric Lightning Path Connecting the 2 Pikachu Tiles -->
  <!-- Path from (150, 82) -> (150, 36) -> (234, 36) -> (234, 114) -->
  <path
    d="M 150 52 L 150 36 L 234 36 L 234 114"
    fill="none"
    stroke="#38bdf8"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.4"
    filter="url(#glow-filter)"
  />
  <path
    d="M 150 52 L 150 36 L 234 36 L 234 114"
    fill="none"
    stroke="url(#lightning)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 150 52 L 150 36 L 234 36 L 234 114"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Lightning Spark Nodes -->
  <circle cx="150" cy="36" r="5" fill="#fef08a" filter="url(#glow-filter)" />
  <circle cx="234" cy="36" r="5" fill="#fef08a" filter="url(#glow-filter)" />
  <circle cx="150" cy="52" r="4" fill="#ffffff" />
  <circle cx="234" cy="114" r="4" fill="#ffffff" />

  <!-- Badge Pill -->
  <g transform="translate(192, 186)">
    <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#0f172a" stroke="#facc15" stroke-width="1.2" />
    <text x="0" y="4" fill="#facc15" font-family="sans-serif" font-weight="800" font-size="10" text-anchor="middle" letter-spacing="1">ONET CONNECT</text>
  </g>
</svg>
