<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 224" fill="none">
  <defs>
    <linearGradient id="trexSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="trexGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Dark Arcade Sky -->
  <rect width="384" height="224" fill="url(#trexSky)" />

  <!-- Stars & Moon -->
  <g fill="white" opacity="0.8">
    <circle cx="50" cy="35" r="1.5" />
    <circle cx="110" cy="20" r="1" />
    <circle cx="165" cy="45" r="1.5" />
    <circle cx="230" cy="25" r="1" />
    <circle cx="280" cy="50" r="1.5" />
    <circle cx="340" cy="30" r="1" />
    <circle cx="310" cy="40" r="12" fill="#f8fafc" opacity="0.9" />
    <circle cx="305" cy="38" r="10" fill="#090d16" />
  </g>

  <!-- Distant Pixel Clouds -->
  <g fill="#334155" opacity="0.4">
    <rect x="70" y="55" width="40" height="8" rx="4" />
    <rect x="80" y="49" width="20" height="8" rx="4" />
    <rect x="220" y="70" width="50" height="10" rx="5" />
    <rect x="235" y="62" width="25" height="10" rx="5" />
  </g>

  <!-- Pterodactyl in Flight -->
  <g transform="translate(185, 45) scale(0.9)" fill="#94a3b8">
    <path d="M0 8 L10 0 L18 8 L10 14 Z" />
    <path d="M10 0 L15 -8 L12 -8 L8 -2 Z" />
    <path d="M-8 8 L0 8 L-4 12 Z" />
  </g>

  <!-- Pixel T-Rex Dinosaur (Green Neon) -->
  <g transform="translate(65, 110) scale(1.15)" fill="#34d399">
    <!-- Head & Snout -->
    <rect x="26" y="0" width="22" height="18" rx="2" />
    <rect x="36" y="8" width="16" height="12" rx="1" />
    <!-- Eye -->
    <rect x="32" y="4" width="4" height="4" fill="#090d16" />
    <!-- Jaw / Mouth -->
    <rect x="42" y="16" width="10" height="4" />
    <!-- Neck & Body -->
    <rect x="18" y="14" width="18" height="24" rx="2" />
    <rect x="10" y="24" width="24" height="20" rx="3" />
    <!-- Small Arm -->
    <rect x="32" y="24" width="8" height="4" rx="1" />
    <rect x="38" y="26" width="4" height="6" rx="1" />
    <!-- Tail -->
    <rect x="2" y="22" width="12" height="10" rx="2" />
    <rect x="-6" y="18" width="10" height="8" rx="2" />
    <rect x="-12" y="14" width="8" height="6" rx="1" />
    <!-- Legs in running pose -->
    <rect x="14" y="42" width="6" height="14" rx="1" />
    <rect x="14" y="54" width="10" height="4" rx="1" />
    <rect x="26" y="40" width="6" height="10" rx="1" transform="rotate(-25 26 40)" />
    <rect x="28" y="48" width="8" height="4" rx="1" />
  </g>

  <!-- Obstacle Cacti (Right) -->
  <g transform="translate(260, 126)" fill="#10b981">
    <!-- Large Cactus -->
    <rect x="12" y="0" width="10" height="50" rx="3" />
    <!-- Left Branch -->
    <rect x="2" y="12" width="12" height="6" rx="2" />
    <rect x="2" y="6" width="6" height="12" rx="2" />
    <!-- Right Branch -->
    <rect x="20" y="18" width="12" height="6" rx="2" />
    <rect x="26" y="12" width="6" height="12" rx="2" />

    <!-- Small Cactus next to it -->
    <rect x="42" y="16" width="8" height="34" rx="2" />
    <rect x="36" y="24" width="8" height="5" rx="1" />
    <rect x="36" y="20" width="5" height="8" rx="1" />
  </g>

  <!-- Ground Track Line -->
  <rect y="174" width="384" height="50" fill="#0f172a" />
  <rect y="174" width="384" height="4" fill="url(#trexGround)" />
  <path d="M0 186 L384 186" stroke="#334155" stroke-width="3" stroke-dasharray="14 10" />
  <path d="M0 200 L384 200" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 16" />

  <!-- Score HUD (Top Right) -->
  <g transform="translate(230, 24)" font-family="monospace" font-size="13" font-weight="bold">
    <text x="0" y="0" fill="#64748b">HI 09999</text>
    <text x="80" y="0" fill="#34d399">02480</text>
  </g>
</svg>
