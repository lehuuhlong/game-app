<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 224" fill="none">
  <defs>
    <linearGradient id="nonoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a18" />
      <stop offset="50%" stop-color="#0c1425" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="neonRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="384" height="224" fill="url(#nonoBg)" />

  <!-- Ambient Light Orbs -->
  <circle cx="210" cy="112" r="80" fill="#38bdf8" opacity="0.08" filter="url(#neonGlow)" />
  <circle cx="270" cy="90" r="60" fill="#e11d48" opacity="0.07" filter="url(#neonGlow)" />

  <!-- Nonogram Board Container (Glassmorphic) -->
  <rect x="72" y="24" width="240" height="176" rx="16" fill="#111827" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5" />

  <!-- Column Clue Numbers -->
  <g fill="#94a3b8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">
    <!-- Col 1 -->
    <text x="160" y="44">1</text>
    <text x="160" y="55">1</text>
    <!-- Col 2 -->
    <text x="185" y="55">3</text>
    <!-- Col 3 -->
    <text x="210" y="44">1</text>
    <text x="210" y="55">1</text>
    <!-- Col 4 -->
    <text x="235" y="55">3</text>
    <!-- Col 5 -->
    <text x="260" y="55">1</text>
  </g>

  <!-- Row Clue Numbers -->
  <g fill="#94a3b8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="end">
    <text x="138" y="77">1 1</text>
    <text x="138" y="102">5</text>
    <text x="138" y="127">5</text>
    <text x="138" y="152">3</text>
    <text x="138" y="177">1</text>
  </g>

  <!-- Divider lines between clues and grid -->
  <line x1="145" y1="32" x2="145" y2="188" stroke="#334155" stroke-width="2" />
  <line x1="120" y1="62" x2="276" y2="62" stroke="#334155" stroke-width="2" />

  <!-- Grid Cells (5x5 Pixel Art Heart) -->
  <!-- Row 1: 0 1 0 1 0 -->
  <rect x="148" y="65" width="22" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <rect x="173" y="65" width="22" height="22" rx="4" fill="url(#neonRose)" filter="url(#neonGlow)" />
  <rect x="198" y="65" width="22" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <rect x="223" y="65" width="22" height="22" rx="4" fill="url(#neonRose)" filter="url(#neonGlow)" />
  <rect x="248" y="65" width="22" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />

  <!-- Row 2: 1 1 1 1 1 -->
  <rect x="148" y="90" width="22" height="22" rx="4" fill="url(#neonRose)" filter="url(#neonGlow)" />
  <rect x="173" y="90" width="22" height="22" rx="4" fill="url(#neonRose)" filter="url(#neonGlow)" />
  <rect x="198" y="90" width="22" height="22" rx="4" fill="url(#neonRose)" filter="url(#neonGlow)" />
  <rect x="223" y="90" width="22" height="22" rx="4" fill="url(#neonRose)" filter="url(#neonGlow)" />
  <rect x="248" y="90" width="22" height="22" rx="4" fill="url(#neonRose)" filter="url(#neonGlow)" />

  <!-- Row 3: 1 1 1 1 1 -->
  <rect x="148" y="115" width="22" height="22" rx="4" fill="url(#neonRose)" filter="url(#neonGlow)" />
  <rect x="173" y="115" width="22" height="22" rx="4" fill="url(#neonRose)" filter="url(#neonGlow)" />
  <rect x="198" y="115" width="22" height="22" rx="4" fill="url(#neonRose)" filter="url(#neonGlow)" />
  <rect x="223" y="115" width="22" height="22" rx="4" fill="url(#neonRose)" filter="url(#neonGlow)" />
  <rect x="248" y="115" width="22" height="22" rx="4" fill="url(#neonRose)" filter="url(#neonGlow)" />

  <!-- Row 4: 0 1 1 1 0 -->
  <rect x="148" y="140" width="22" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <rect x="173" y="140" width="22" height="22" rx="4" fill="url(#neonRose)" filter="url(#neonGlow)" />
  <rect x="198" y="140" width="22" height="22" rx="4" fill="url(#neonRose)" filter="url(#neonGlow)" />
  <rect x="223" y="140" width="22" height="22" rx="4" fill="url(#neonRose)" filter="url(#neonGlow)" />
  <rect x="248" y="140" width="22" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />

  <!-- Row 5: 0 0 1 0 0 -->
  <rect x="148" y="165" width="22" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <rect x="173" y="165" width="22" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <rect x="198" y="165" width="22" height="22" rx="4" fill="url(#neonRose)" filter="url(#neonGlow)" />
  <rect x="223" y="165" width="22" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <rect x="248" y="165" width="22" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />

  <!-- X marks on empty cells -->
  <g stroke="#64748b" stroke-width="1.5" stroke-linecap="round">
    <path d="M154 71 l10 10 M164 71 l-10 10" />
    <path d="M204 71 l10 10 M214 71 l-10 10" />
    <path d="M254 71 l10 10 M264 71 l-10 10" />
    <path d="M154 146 l10 10 M164 146 l-10 10" />
    <path d="M254 146 l10 10 M264 146 l-10 10" />
    <path d="M154 171 l10 10 M164 171 l-10 10" />
    <path d="M179 171 l10 10 M189 171 l-10 10" />
    <path d="M229 171 l10 10 M239 171 l-10 10" />
    <path d="M254 171 l10 10 M264 171 l-10 10" />
  </g>
</svg>
