<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 224" fill="none">
  <defs>
    <linearGradient id="bgAim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#180509" />
      <stop offset="50%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="targetRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>

  <rect width="384" height="224" fill="url(#bgAim)" />

  <!-- Ambient Light -->
  <circle cx="192" cy="112" r="100" fill="#f43f5e" fill-opacity="0.15" />

  <!-- Big Central Target -->
  <g transform="translate(192, 112)">
    <!-- Outer dashed radar circle -->
    <circle cx="0" cy="0" r="75" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />
    <!-- Secondary ring -->
    <circle cx="0" cy="0" r="54" stroke="#f43f5e" stroke-width="2.5" opacity="0.6" />
    <circle cx="0" cy="0" r="34" stroke="#fb7185" stroke-width="3" opacity="0.8" />
    <!-- Center Bullseye Disc -->
    <circle cx="0" cy="0" r="16" fill="url(#targetRed)" stroke="#fecdd3" stroke-width="3" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />

    <!-- Crosshair Lasers -->
    <line x1="-90" y1="0" x2="-20" y2="0" stroke="#f43f5e" stroke-width="2" />
    <line x1="20" y1="0" x2="90" y2="0" stroke="#f43f5e" stroke-width="2" />
    <line x1="0" y1="-90" x2="0" y2="-20" stroke="#f43f5e" stroke-width="2" />
    <line x1="0" y1="20" x2="0" y2="90" stroke="#f43f5e" stroke-width="2" />

    <!-- Corner Brackets -->
    <path d="M-60 -45 L-75 -45 L-75 -30" stroke="#fb7185" stroke-width="3" fill="none" />
    <path d="M60 -45 L75 -45 L75 -30" stroke="#fb7185" stroke-width="3" fill="none" />
    <path d="M-60 45 L-75 45 L-75 30" stroke="#fb7185" stroke-width="3" fill="none" />
    <path d="M60 45 L75 45 L75 30" stroke="#fb7185" stroke-width="3" fill="none" />
  </g>

  <!-- Secondary Targets on sides -->
  <g transform="translate(68, 65) scale(0.65)">
    <circle cx="0" cy="0" r="30" stroke="#f43f5e" stroke-width="2" opacity="0.6" />
    <circle cx="0" cy="0" r="14" fill="url(#targetRed)" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>
  <g transform="translate(316, 155) scale(0.65)">
    <circle cx="0" cy="0" r="30" stroke="#f43f5e" stroke-width="2" opacity="0.6" />
    <circle cx="0" cy="0" r="14" fill="url(#targetRed)" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>

  <!-- Hit Marker Badge "+100 CRIT" & Accuracy -->
  <g transform="translate(235, 60)">
    <rect x="-10" y="-12" width="76" height="24" rx="6" fill="#881337" stroke="#f43f5e" stroke-width="1.5" />
    <text x="28" y="4" fill="#fecdd3" font-family="monospace" font-weight="900" font-size="12" text-anchor="middle">+100 CRIT</text>
  </g>
  <g transform="translate(45, 185)">
    <rect x="0" y="-12" width="84" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="42" y="4" fill="#34d399" font-family="monospace" font-weight="900" font-size="12" text-anchor="middle">99.8% ACC</text>
  </g>
</svg>
