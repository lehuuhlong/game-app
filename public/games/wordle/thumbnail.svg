<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 224" fill="none">
  <defs>
    <linearGradient id="bgWordle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="tileGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="tileYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
  </defs>

  <rect width="384" height="224" fill="url(#bgWordle)" />

  <!-- Ambient Light -->
  <circle cx="192" cy="112" r="100" fill="#22c55e" fill-opacity="0.15" />

  <!-- 5-Letter Word Grid Container -->
  <g transform="translate(62, 28)">
    <!-- Row 1: G - U - E - S - S -->
    <rect x="0" y="0" width="46" height="46" rx="8" fill="#334155" stroke="#475569" stroke-width="2" />
    <text x="23" y="27" fill="#f8fafc" font-family="monospace" font-weight="900" font-size="22" text-anchor="middle" dominant-baseline="middle">G</text>

    <rect x="54" y="0" width="46" height="46" rx="8" fill="url(#tileYellow)" stroke="#fde047" stroke-width="2" />
    <text x="77" y="27" fill="#ffffff" font-family="monospace" font-weight="900" font-size="22" text-anchor="middle" dominant-baseline="middle">U</text>

    <rect x="108" y="0" width="46" height="46" rx="8" fill="#334155" stroke="#475569" stroke-width="2" />
    <text x="131" y="27" fill="#f8fafc" font-family="monospace" font-weight="900" font-size="22" text-anchor="middle" dominant-baseline="middle">E</text>

    <rect x="162" y="0" width="46" height="46" rx="8" fill="url(#tileYellow)" stroke="#fde047" stroke-width="2" />
    <text x="185" y="27" fill="#ffffff" font-family="monospace" font-weight="900" font-size="22" text-anchor="middle" dominant-baseline="middle">S</text>

    <rect x="216" y="0" width="46" height="46" rx="8" fill="#334155" stroke="#475569" stroke-width="2" />
    <text x="239" y="27" fill="#f8fafc" font-family="monospace" font-weight="900" font-size="22" text-anchor="middle" dominant-baseline="middle">T</text>

    <!-- Row 2: P - L - A - N - T -->
    <rect x="0" y="58" width="46" height="46" rx="8" fill="url(#tileYellow)" stroke="#fde047" stroke-width="2" />
    <text x="23" y="85" fill="#ffffff" font-family="monospace" font-weight="900" font-size="22" text-anchor="middle" dominant-baseline="middle">P</text>

    <rect x="54" y="58" width="46" height="46" rx="8" fill="url(#tileGreen)" stroke="#86efac" stroke-width="2" />
    <text x="77" y="85" fill="#ffffff" font-family="monospace" font-weight="900" font-size="22" text-anchor="middle" dominant-baseline="middle">L</text>

    <rect x="108" y="58" width="46" height="46" rx="8" fill="url(#tileGreen)" stroke="#86efac" stroke-width="2" />
    <text x="131" y="85" fill="#ffffff" font-family="monospace" font-weight="900" font-size="22" text-anchor="middle" dominant-baseline="middle">A</text>

    <rect x="162" y="58" width="46" height="46" rx="8" fill="#334155" stroke="#475569" stroke-width="2" />
    <text x="185" y="85" fill="#f8fafc" font-family="monospace" font-weight="900" font-size="22" text-anchor="middle" dominant-baseline="middle">N</text>

    <rect x="216" y="58" width="46" height="46" rx="8" fill="#334155" stroke="#475569" stroke-width="2" />
    <text x="239" y="85" fill="#f8fafc" font-family="monospace" font-weight="900" font-size="22" text-anchor="middle" dominant-baseline="middle">E</text>

    <!-- Row 3: ALL GREEN WIN! P - L - A - Y - S -->
    <rect x="0" y="116" width="46" height="46" rx="8" fill="url(#tileGreen)" stroke="#bbf7d0" stroke-width="2.5" />
    <text x="23" y="143" fill="#ffffff" font-family="monospace" font-weight="900" font-size="23" text-anchor="middle" dominant-baseline="middle">P</text>

    <rect x="54" y="116" width="46" height="46" rx="8" fill="url(#tileGreen)" stroke="#bbf7d0" stroke-width="2.5" />
    <text x="77" y="143" fill="#ffffff" font-family="monospace" font-weight="900" font-size="23" text-anchor="middle" dominant-baseline="middle">L</text>

    <rect x="108" y="116" width="46" height="46" rx="8" fill="url(#tileGreen)" stroke="#bbf7d0" stroke-width="2.5" />
    <text x="131" y="143" fill="#ffffff" font-family="monospace" font-weight="900" font-size="23" text-anchor="middle" dominant-baseline="middle">A</text>

    <rect x="162" y="116" width="46" height="46" rx="8" fill="url(#tileGreen)" stroke="#bbf7d0" stroke-width="2.5" />
    <text x="185" y="143" fill="#ffffff" font-family="monospace" font-weight="900" font-size="23" text-anchor="middle" dominant-baseline="middle">Y</text>

    <rect x="216" y="116" width="46" height="46" rx="8" fill="url(#tileGreen)" stroke="#bbf7d0" stroke-width="2.5" />
    <text x="239" y="143" fill="#ffffff" font-family="monospace" font-weight="900" font-size="23" text-anchor="middle" dominant-baseline="middle">S</text>
  </g>

  <!-- Victory Gold Star Sparkles -->
  <polygon points="345,40 348,46 355,48 348,50 345,57 342,50 335,48 342,46" fill="#fde047" />
  <polygon points="35,170 37.5,175 35,182 32.5,175 35,170" fill="#4ade80" />
</svg>
