<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#120c24"/>
      <stop offset="100%" stop-color="#1f0a2e"/>
    </linearGradient>
    <linearGradient id="p1Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="p2Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="clashGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffae0" stop-opacity="1"/>
      <stop offset="35%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="200" height="200" rx="28" fill="url(#bg)"/>

  <!-- Cyberpunk Perspective Grid -->
  <g opacity="0.35">
    <line x1="0" y1="150" x2="200" y2="150" stroke="#00f0ff" stroke-width="1.5"/>
    <line x1="0" y1="165" x2="200" y2="165" stroke="#00f0ff" stroke-width="1"/>
    <line x1="0" y1="182" x2="200" y2="182" stroke="#00f0ff" stroke-width="0.8"/>
    <line x1="100" y1="150" x2="100" y2="200" stroke="#00f0ff" stroke-width="1"/>
    <line x1="100" y1="150" x2="60" y2="200" stroke="#00f0ff" stroke-width="1"/>
    <line x1="100" y1="150" x2="140" y2="200" stroke="#00f0ff" stroke-width="1"/>
    <line x1="100" y1="150" x2="20" y2="200" stroke="#00f0ff" stroke-width="1"/>
    <line x1="100" y1="150" x2="180" y2="200" stroke="#00f0ff" stroke-width="1"/>
  </g>

  <!-- Distant City Skyline Silhouettes -->
  <g fill="#161233" opacity="0.6">
    <rect x="18" y="85" width="22" height="65"/>
    <rect x="44" y="65" width="28" height="85"/>
    <rect x="76" y="95" width="20" height="55"/>
    <rect x="108" y="75" width="26" height="75"/>
    <rect x="138" y="88" width="24" height="62"/>
    <rect x="166" y="60" width="20" height="90"/>
  </g>

  <!-- Fighter 1 (Neon Pink/Red Stance) -->
  <g transform="translate(42, 68)">
    <!-- Shadow -->
    <ellipse cx="20" cy="82" rx="22" ry="5" fill="#ff3366" opacity="0.25"/>
    <!-- Head & Visor -->
    <circle cx="16" cy="14" r="11" fill="url(#p1Grad)"/>
    <rect x="14" y="12" width="12" height="4" rx="2" fill="#fff" opacity="0.9"/>
    <!-- Torso -->
    <rect x="8" y="27" width="16" height="24" rx="3" fill="url(#p1Grad)"/>
    <!-- Punching Arm -->
    <path d="M22 30 L46 36 L52 38" stroke="#ff3366" stroke-width="7" stroke-linecap="round"/>
    <circle cx="52" cy="38" r="5" fill="#ffe4e6"/>
    <!-- Legs in fighting stance -->
    <path d="M12 51 L6 80" stroke="#ff3366" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 51 L28 80" stroke="#ff3366" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Fighter 2 (Electric Cyan Stance) -->
  <g transform="translate(106, 68)">
    <!-- Shadow -->
    <ellipse cx="24" cy="82" rx="22" ry="5" fill="#00f0ff" opacity="0.25"/>
    <!-- Head & Visor -->
    <circle cx="28" cy="14" r="11" fill="url(#p2Grad)"/>
    <rect x="18" y="12" width="12" height="4" rx="2" fill="#fff" opacity="0.9"/>
    <!-- Torso -->
    <rect x="20" y="27" width="16" height="24" rx="3" fill="url(#p2Grad)"/>
    <!-- Guarding / Counter Arm -->
    <path d="M22 32 L-2 36 L-8 38" stroke="#00f0ff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-8" cy="38" r="5" fill="#e0f2fe"/>
    <!-- Legs in stance -->
    <path d="M24 51 L18 80" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
    <path d="M32 51 L38 80" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Impact Clash / Hit Sparks -->
  <circle cx="98" cy="106" r="24" fill="url(#clashGlow)"/>
  <path d="M98 90 L102 102 L116 104 L104 110 L108 122 L98 114 L88 122 L92 110 L80 104 L94 102 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Hit Sparks Flash rays -->
  <line x1="98" y1="78" x2="98" y2="66" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="120" y1="92" x2="132" y2="84" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="76" y1="92" x2="64" y2="84" stroke="#ff3366" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="118" y1="122" x2="130" y2="132" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Retro Title Badge Banner -->
  <rect x="36" y="22" width="128" height="26" rx="6" fill="#030712" stroke="#00f0ff" stroke-width="1.2" opacity="0.9"/>
  <text x="100" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff" letter-spacing="2">
    CYBER BRAWL
  </text>
  <circle cx="46" cy="35" r="3" fill="#ff3366"/>
  <circle cx="154" cy="35" r="3" fill="#00f0ff"/>
</svg>
