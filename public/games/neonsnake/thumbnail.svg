<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#090d1f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="snakeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="28" fill="url(#bg)"/>

  <!-- Cyberpunk Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="20" y1="0" x2="20" y2="200"/>
    <line x1="40" y1="0" x2="40" y2="200"/>
    <line x1="60" y1="0" x2="60" y2="200"/>
    <line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="120" y1="0" x2="120" y2="200"/>
    <line x1="140" y1="0" x2="140" y2="200"/>
    <line x1="160" y1="0" x2="160" y2="200"/>
    <line x1="180" y1="0" x2="180" y2="200"/>

    <line x1="0" y1="20" x2="200" y2="20"/>
    <line x1="0" y1="40" x2="200" y2="40"/>
    <line x1="0" y1="60" x2="200" y2="60"/>
    <line x1="0" y1="80" x2="200" y2="80"/>
    <line x1="0" y1="100" x2="200" y2="100"/>
    <line x1="0" y1="120" x2="200" y2="120"/>
    <line x1="0" y1="140" x2="200" y2="140"/>
    <line x1="0" y1="160" x2="200" y2="160"/>
    <line x1="0" y1="180" x2="200" y2="180"/>
  </g>

  <!-- Food Glow & Core (Magenta Energy Orb) -->
  <rect x="137" y="57" width="26" height="26" rx="6" fill="#ec4899" opacity="0.3"/>
  <rect x="140" y="60" width="20" height="20" rx="4" fill="#f43f5e"/>
  <rect x="146" y="66" width="8" height="8" rx="2" fill="#ffffff"/>

  <!-- Snake Body Tail Glows & Cores -->
  <!-- Tail segment 4 -->
  <rect x="38" y="138" width="24" height="24" rx="5" fill="#a855f7" opacity="0.25"/>
  <rect x="41" y="141" width="18" height="18" rx="3.5" fill="#9333ea"/>
  <rect x="45" y="145" width="10" height="10" rx="2" fill="#c084fc"/>

  <!-- Body segment 3 -->
  <rect x="58" y="138" width="24" height="24" rx="5" fill="#818cf8" opacity="0.25"/>
  <rect x="61" y="141" width="18" height="18" rx="3.5" fill="#6366f1"/>
  <rect x="65" y="145" width="10" height="10" rx="2" fill="#a855f7"/>

  <!-- Body segment 2 -->
  <rect x="78" y="138" width="24" height="24" rx="5" fill="#818cf8" opacity="0.25"/>
  <rect x="81" y="141" width="18" height="18" rx="3.5" fill="#4f46e5"/>
  <rect x="85" y="145" width="10" height="10" rx="2" fill="#818cf8"/>

  <!-- Body segment 1 (Turn) -->
  <rect x="78" y="118" width="24" height="24" rx="5" fill="#38bdf8" opacity="0.25"/>
  <rect x="81" y="121" width="18" height="18" rx="3.5" fill="#0284c7"/>
  <rect x="85" y="125" width="10" height="10" rx="2" fill="#38bdf8"/>

  <!-- Body segment 0.5 -->
  <rect x="78" y="98" width="24" height="24" rx="5" fill="#06b6d4" opacity="0.28"/>
  <rect x="81" y="101" width="18" height="18" rx="3.5" fill="#0891b2"/>
  <rect x="85" y="105" width="10" height="10" rx="2" fill="#22d3ee"/>

  <!-- Body segment Turn 2 -->
  <rect x="98" y="98" width="24" height="24" rx="5" fill="#06b6d4" opacity="0.3"/>
  <rect x="101" y="101" width="18" height="18" rx="3.5" fill="#06b6d4"/>
  <rect x="105" y="105" width="10" height="10" rx="2" fill="#67e8f9"/>

  <!-- Snake Head (Cyan Glow + Ultra Bright Core) -->
  <rect x="97" y="57" width="26" height="26" rx="6" fill="#06b6d4" opacity="0.4"/>
  <rect x="100" y="60" width="20" height="20" rx="4" fill="#22d3ee"/>
  <rect x="105" y="65" width="10" height="10" rx="2" fill="#e0f2fe"/>
  <!-- Head Eyes -->
  <circle cx="114" cy="66" r="1.5" fill="#0891b2"/>
  <circle cx="114" cy="74" r="1.5" fill="#0891b2"/>

  <!-- Subtle Cyber Tech border -->
  <rect x="1" y="1" width="198" height="198" rx="27" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.3"/>
</svg>
