<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 224" fill="none">
  <defs>
    <linearGradient id="bgSudoku" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <rect width="384" height="224" fill="url(#bgSudoku)" />

  <!-- Ambient Light -->
  <circle cx="192" cy="112" r="100" fill="#38bdf8" fill-opacity="0.15" />

  <!-- Sudoku 3x3 Block Grid (6x6 visual layout) -->
  <g transform="translate(97, 18)">
    <!-- Board Outer Border -->
    <rect x="0" y="0" width="190" height="190" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="3.5" />

    <!-- Active Intersection Highlight Cross -->
    <rect x="0" y="64" width="190" height="30" fill="#38bdf8" fill-opacity="0.12" />
    <rect x="64" y="0" width="30" height="190" fill="#38bdf8" fill-opacity="0.12" />
    <rect x="64" y="64" width="30" height="30" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2" />

    <!-- Thin Grid Lines (1-pixel) -->
    <g stroke="#334155" stroke-width="1">
      <line x1="32" y1="0" x2="32" y2="190" />
      <line x1="95" y1="0" x2="95" y2="190" />
      <line x1="158" y1="0" x2="158" y2="190" />

      <line x1="0" y1="32" x2="190" y2="32" />
      <line x1="0" y1="95" x2="190" y2="95" />
      <line x1="0" y1="158" x2="190" y2="158" />
    </g>

    <!-- Thick 3x3 Block Borders -->
    <g stroke="#0284c7" stroke-width="2.5">
      <line x1="64" y1="0" x2="64" y2="190" />
      <line x1="127" y1="0" x2="127" y2="190" />
      <line x1="0" y1="64" x2="190" y2="64" />
      <line x1="0" y1="127" x2="190" y2="127" />
    </g>

    <!-- Numbers Placed in Grid -->
    <g font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle" dominant-baseline="middle">
      <!-- Row 0 -->
      <text x="16" y="17" fill="#f8fafc">5</text>
      <text x="48" y="17" fill="#94a3b8">3</text>
      <text x="111" y="17" fill="#f8fafc">7</text>
      <text x="174" y="17" fill="#94a3b8">2</text>

      <!-- Row 1 -->
      <text x="16" y="49" fill="#94a3b8">6</text>
      <text x="80" y="49" fill="#38bdf8">1</text>
      <text x="111" y="49" fill="#94a3b8">9</text>
      <text x="143" y="49" fill="#f8fafc">5</text>

      <!-- Row 2 (Intersection Target 8) -->
      <text x="16" y="80" fill="#94a3b8">1</text>
      <text x="48" y="80" fill="#f8fafc">9</text>
      <text x="80" y="80" fill="#ffffff" font-size="18">8</text>
      <text x="143" y="80" fill="#94a3b8">6</text>

      <!-- Row 3 -->
      <text x="48" y="112" fill="#38bdf8">6</text>
      <text x="111" y="112" fill="#f8fafc">8</text>
      <text x="174" y="112" fill="#38bdf8">3</text>

      <!-- Row 4 -->
      <text x="16" y="144" fill="#94a3b8">8</text>
      <text x="80" y="144" fill="#f8fafc">5</text>
      <text x="143" y="144" fill="#38bdf8">1</text>
      <text x="174" y="144" fill="#94a3b8">6</text>

      <!-- Row 5 -->
      <text x="48" y="175" fill="#f8fafc">4</text>
      <text x="111" y="175" fill="#94a3b8">2</text>
      <text x="174" y="175" fill="#f8fafc">9</text>
    </g>
  </g>
</svg>
