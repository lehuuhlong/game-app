<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 224" fill="none">
  <defs>
    <linearGradient id="bgCaro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gradX" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="gradO" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="384" height="224" fill="url(#bgCaro)" />

  <!-- Ambient Glow -->
  <circle cx="192" cy="112" r="110" fill="#8b5cf6" fill-opacity="0.15" />

  <!-- Board Wooden / Tech Grid Container -->
  <rect x="52" y="24" width="280" height="176" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="3" />

  <!-- Grid Lines -->
  <g stroke="#334155" stroke-width="1.5" stroke-dasharray="2 4">
    <!-- Horizontal -->
    <line x1="68" y1="64" x2="316" y2="64" />
    <line x1="68" y1="104" x2="316" y2="104" />
    <line x1="68" y1="144" x2="316" y2="144" />
    <line x1="68" y1="184" x2="316" y2="184" />
    <!-- Vertical -->
    <line x1="108" y1="36" x2="108" y2="188" />
    <line x1="150" y1="36" x2="150" y2="188" />
    <line x1="192" y1="36" x2="192" y2="188" />
    <line x1="234" y1="36" x2="234" y2="188" />
    <line x1="276" y1="36" x2="276" y2="188" />
  </g>

  <!-- 5-in-a-row Winning Laser Beam -->
  <line x1="88" y1="104" x2="296" y2="104" stroke="#a855f7" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <line x1="88" y1="104" x2="296" y2="104" stroke="#f3e8ff" stroke-width="2" stroke-linecap="round" />

  <!-- Game Pieces (X and O) -->
  <!-- Row 1 -->
  <!-- O at (108, 64) -->
  <circle cx="108" cy="64" r="14" stroke="url(#gradO)" stroke-width="4.5" fill="rgba(56,189,248,0.15)" />
  <!-- X at (192, 64) -->
  <g transform="translate(192, 64)">
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="url(#gradX)" stroke-width="5" stroke-linecap="round" />
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="url(#gradX)" stroke-width="5" stroke-linecap="round" />
  </g>
  <!-- O at (276, 64) -->
  <circle cx="276" cy="64" r="14" stroke="url(#gradO)" stroke-width="4.5" fill="rgba(56,189,248,0.15)" />

  <!-- Row 2: Winning 5 X's in a line -->
  <!-- X 1 at (108, 104) -->
  <g transform="translate(108, 104)">
    <circle cx="0" cy="0" r="17" fill="#8b5cf6" fill-opacity="0.25" />
    <line x1="-11" y1="-11" x2="11" y2="11" stroke="#e9d5ff" stroke-width="5" stroke-linecap="round" />
    <line x1="11" y1="-11" x2="-11" y2="11" stroke="#e9d5ff" stroke-width="5" stroke-linecap="round" />
  </g>
  <!-- X 2 at (150, 104) -->
  <g transform="translate(150, 104)">
    <circle cx="0" cy="0" r="17" fill="#8b5cf6" fill-opacity="0.25" />
    <line x1="-11" y1="-11" x2="11" y2="11" stroke="#e9d5ff" stroke-width="5" stroke-linecap="round" />
    <line x1="11" y1="-11" x2="-11" y2="11" stroke="#e9d5ff" stroke-width="5" stroke-linecap="round" />
  </g>
  <!-- X 3 at (192, 104) -->
  <g transform="translate(192, 104)">
    <circle cx="0" cy="0" r="18" fill="#8b5cf6" fill-opacity="0.35" />
    <line x1="-11" y1="-11" x2="11" y2="11" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" />
    <line x1="11" y1="-11" x2="-11" y2="11" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" />
  </g>
  <!-- X 4 at (234, 104) -->
  <g transform="translate(234, 104)">
    <circle cx="0" cy="0" r="17" fill="#8b5cf6" fill-opacity="0.25" />
    <line x1="-11" y1="-11" x2="11" y2="11" stroke="#e9d5ff" stroke-width="5" stroke-linecap="round" />
    <line x1="11" y1="-11" x2="-11" y2="11" stroke="#e9d5ff" stroke-width="5" stroke-linecap="round" />
  </g>
  <!-- X 5 at (276, 104) -->
  <g transform="translate(276, 104)">
    <circle cx="0" cy="0" r="17" fill="#8b5cf6" fill-opacity="0.25" />
    <line x1="-11" y1="-11" x2="11" y2="11" stroke="#e9d5ff" stroke-width="5" stroke-linecap="round" />
    <line x1="11" y1="-11" x2="-11" y2="11" stroke="#e9d5ff" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Row 3 -->
  <!-- O at (150, 144) -->
  <circle cx="150" cy="144" r="14" stroke="url(#gradO)" stroke-width="4.5" fill="rgba(56,189,248,0.15)" />
  <!-- O at (234, 144) -->
  <circle cx="234" cy="144" r="14" stroke="url(#gradO)" stroke-width="4.5" fill="rgba(56,189,248,0.15)" />
</svg>
