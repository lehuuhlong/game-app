<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 224" fill="none">
  <defs>
    <radialGradient id="mazeBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <linearGradient id="wallNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glowYellow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPower" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Arcade Background -->
  <rect width="384" height="224" rx="12" fill="url(#mazeBg)" />

  <!-- Maze Grid Guidelines -->
  <g stroke="rgba(30, 58, 138, 0.25)" stroke-width="1">
    <line x1="32" y1="0" x2="32" y2="224" />
    <line x1="96" y1="0" x2="96" y2="224" />
    <line x1="160" y1="0" x2="160" y2="224" />
    <line x1="224" y1="0" x2="224" y2="224" />
    <line x1="288" y1="0" x2="288" y2="224" />
    <line x1="352" y1="0" x2="352" y2="224" />
    <line x1="0" y1="48" x2="384" y2="48" />
    <line x1="0" y1="112" x2="384" y2="112" />
    <line x1="0" y1="176" x2="384" y2="176" />
  </g>

  <!-- Stylized Maze Outer & Inner Walls -->
  <g stroke="url(#wallNeon)" stroke-width="3.5" fill="rgba(30, 58, 138, 0.25)" stroke-linejoin="round" filter="url(#glowBlue)">
    <rect x="24" y="24" width="336" height="176" rx="16" />
    <rect x="64" y="56" width="64" height="40" rx="8" />
    <rect x="256" y="56" width="64" height="40" rx="8" />
    <path d="M160 56 H224 V96 H160 Z" />
    <rect x="64" y="128" width="64" height="40" rx="8" />
    <rect x="256" y="128" width="64" height="40" rx="8" />
    <!-- Center ghost house structure -->
    <rect x="156" y="124" width="72" height="44" rx="6" />
  </g>

  <!-- Pink Gate Door -->
  <line x1="176" y1="124" x2="208" y2="124" stroke="#ec4899" stroke-width="3" />

  <!-- Glowing Normal Pellets along path -->
  <g fill="#fde047" filter="url(#glowYellow)">
    <circle cx="44" cy="90" r="3" />
    <circle cx="44" cy="112" r="3" />
    <circle cx="44" cy="134" r="3" />
    <circle cx="96" cy="112" r="3" />
    <circle cx="118" cy="112" r="3" />
    <circle cx="140" cy="112" r="3" />
    <circle cx="162" cy="112" r="3" />
    <circle cx="222" cy="112" r="3" />
    <circle cx="244" cy="112" r="3" />
    <circle cx="266" cy="112" r="3" />
    <circle cx="340" cy="90" r="3" />
    <circle cx="340" cy="134" r="3" />
  </g>

  <!-- Pulsing Power-Pellet in Corner -->
  <g filter="url(#glowPower)">
    <circle cx="44" cy="44" r="8.5" fill="#f59e0b" opacity="0.9" />
    <circle cx="44" cy="44" r="5" fill="#ffffff" />
    <circle cx="340" cy="44" r="8.5" fill="#f59e0b" opacity="0.9" />
    <circle cx="340" cy="44" r="5" fill="#ffffff" />
  </g>

  <!-- Chaser 1 (Cyan / Azure) -->
  <g transform="translate(142, 112)">
    <path d="M-10 2 C-10 -10 10 -10 10 2 L10 10 Q6 14 3 10 Q0 14 -3 10 Q-6 14 -10 10 Z" fill="#06b6d4" />
    <ellipse cx="-4" cy="0" rx="3.5" ry="4.5" fill="#ffffff" />
    <ellipse cx="4" cy="0" rx="3.5" ry="4.5" fill="#ffffff" />
    <circle cx="-2.5" cy="0" r="2" fill="#0f172a" />
    <circle cx="5.5" cy="0" r="2" fill="#0f172a" />
  </g>

  <!-- Chaser 2 (Crimson / Red) -->
  <g transform="translate(204, 112)">
    <path d="M-10 2 C-10 -10 10 -10 10 2 L10 10 Q6 14 3 10 Q0 14 -3 10 Q-6 14 -10 10 Z" fill="#ef4444" />
    <ellipse cx="-4" cy="0" rx="3.5" ry="4.5" fill="#ffffff" />
    <ellipse cx="4" cy="0" rx="3.5" ry="4.5" fill="#ffffff" />
    <circle cx="-5.5" cy="0" r="2" fill="#0f172a" />
    <circle cx="2.5" cy="0" r="2" fill="#0f172a" />
  </g>

  <!-- Muncher (Yellow circle with mouth arc facing right) -->
  <g transform="translate(290, 112)" filter="url(#glowYellow)">
    <path d="M0 0 L12 -6.5 A14 14 0 1 0 12 6.5 Z" fill="#facc15" />
    <circle cx="2" cy="-7" r="2.2" fill="#0f172a" />
    <circle cx="2.8" cy="-7.5" r="0.8" fill="#ffffff" />
  </g>
</svg>
