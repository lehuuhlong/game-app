<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 224" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061a14" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#04120e" />
    </linearGradient>

    <!-- Wood Cushion Gradient -->
    <linearGradient id="woodRail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#290f02" />
    </linearGradient>

    <!-- Felt Gradient -->
    <radialGradient id="feltGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </radialGradient>

    <!-- Ball Shines -->
    <radialGradient id="ballShine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>

    <!-- 8-ball gradient -->
    <radialGradient id="eightBall" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="40%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Solid Red ball gradient -->
    <radialGradient id="redBall" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </radialGradient>

    <!-- Cue Ball gradient -->
    <radialGradient id="cueBall" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>

    <!-- Cue Stick gradient -->
    <linearGradient id="cueStickGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Pocket Shadow -->
    <radialGradient id="pocketGrad" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="384" height="224" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="192" cy="112" r="120" fill="#10b981" fill-opacity="0.08" />

  <!-- Table Outer Wooden Frame -->
  <g transform="translate(32, 28)">
    <!-- Shadow beneath table -->
    <rect x="-4" y="4" width="328" height="168" rx="18" fill="#000000" fill-opacity="0.6" />

    <!-- Wood rail -->
    <rect x="0" y="0" width="320" height="160" rx="16" fill="url(#woodRail)" stroke="#92400e" stroke-width="2" />

    <!-- Brass Corner Accents -->
    <circle cx="16" cy="16" r="6" fill="#fbbf24" stroke="#78350f" stroke-width="1.5" />
    <circle cx="304" cy="16" r="6" fill="#fbbf24" stroke="#78350f" stroke-width="1.5" />
    <circle cx="16" cy="144" r="6" fill="#fbbf24" stroke="#78350f" stroke-width="1.5" />
    <circle cx="304" cy="144" r="6" fill="#fbbf24" stroke="#78350f" stroke-width="1.5" />
    <circle cx="160" cy="10" r="4" fill="#fbbf24" stroke="#78350f" stroke-width="1" />
    <circle cx="160" cy="150" r="4" fill="#fbbf24" stroke="#78350f" stroke-width="1" />

    <!-- Felt playing surface -->
    <rect x="18" y="18" width="284" height="124" rx="8" fill="url(#feltGrad)" />

    <!-- Pockets -->
    <!-- Top Left -->
    <circle cx="24" cy="24" r="11" fill="url(#pocketGrad)" stroke="#0f172a" stroke-width="1" />
    <!-- Top Center -->
    <circle cx="160" cy="18" r="9" fill="url(#pocketGrad)" stroke="#0f172a" stroke-width="1" />
    <!-- Top Right -->
    <circle cx="296" cy="24" r="11" fill="url(#pocketGrad)" stroke="#0f172a" stroke-width="1" />
    <!-- Bottom Left -->
    <circle cx="24" cy="136" r="11" fill="url(#pocketGrad)" stroke="#0f172a" stroke-width="1" />
    <!-- Bottom Center -->
    <circle cx="160" cy="142" r="9" fill="url(#pocketGrad)" stroke="#0f172a" stroke-width="1" />
    <!-- Bottom Right -->
    <circle cx="296" cy="136" r="11" fill="url(#pocketGrad)" stroke="#0f172a" stroke-width="1" />

    <!-- Head string subtle line -->
    <line x1="90" y1="18" x2="90" y2="142" stroke="#ffffff" stroke-opacity="0.1" stroke-dasharray="3 3" />

    <!-- Yellow / Solid 1 Ball -->
    <g transform="translate(195, 68)">
      <ellipse cx="2" cy="12" rx="11" ry="5" fill="#000000" fill-opacity="0.35" />
      <circle cx="0" cy="0" r="12" fill="#eab308" />
      <circle cx="0" cy="0" r="12" fill="url(#ballShine)" />
      <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
      <text x="0" y="3" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle" fill="#000000">1</text>
    </g>

    <!-- Blue / Solid 2 Ball -->
    <g transform="translate(225, 92)">
      <ellipse cx="2" cy="12" rx="11" ry="5" fill="#000000" fill-opacity="0.35" />
      <circle cx="0" cy="0" r="12" fill="#2563eb" />
      <circle cx="0" cy="0" r="12" fill="url(#ballShine)" />
      <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
      <text x="0" y="3" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle" fill="#000000">2</text>
    </g>

    <!-- Red Ball (Solid 3) -->
    <g transform="translate(210, 50)">
      <ellipse cx="2" cy="12" rx="11" ry="5" fill="#000000" fill-opacity="0.35" />
      <circle cx="0" cy="0" r="12" fill="url(#redBall)" />
      <circle cx="0" cy="0" r="12" fill="url(#ballShine)" />
      <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
      <text x="0" y="3" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle" fill="#000000">3</text>
    </g>

    <!-- 8-Ball Centerpiece -->
    <g transform="translate(175, 85)">
      <!-- Ball Shadow -->
      <ellipse cx="2" cy="14" rx="13" ry="5" fill="#000000" fill-opacity="0.45" />
      <!-- Ball Body -->
      <circle cx="0" cy="0" r="14" fill="url(#eightBall)" />
      <circle cx="0" cy="0" r="14" fill="url(#ballShine)" />
      <!-- 8-Number Target -->
      <circle cx="0" cy="0" r="5.5" fill="#ffffff" />
      <text x="0" y="3.5" font-size="10" font-weight="900" font-family="sans-serif" text-anchor="middle" fill="#0f172a">8</text>
    </g>

    <!-- Cue Ball with Motion Guideline -->
    <g transform="translate(85, 96)">
      <!-- Aim guideline -->
      <line x1="0" y1="0" x2="68" y2="-8" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.8" />
      <!-- Cue Ball Shadow -->
      <ellipse cx="1" cy="13" rx="12" ry="5" fill="#000000" fill-opacity="0.35" />
      <!-- Cue Ball Body -->
      <circle cx="0" cy="0" r="13" fill="url(#cueBall)" />
      <circle cx="0" cy="0" r="13" fill="url(#ballShine)" />
      <circle cx="-3" cy="-3" r="1.5" fill="#ef4444" /> <!-- Red dot English indicator -->
    </g>

    <!-- Cue Stick Aiming at Cue Ball -->
    <g transform="translate(18, 105) rotate(7)">
      <!-- Cue Stick Body -->
      <polygon points="0,-2.5 0,2.5 -95,4.5 -95,-4.5" fill="url(#cueStickGrad)" stroke="#451a03" stroke-width="0.5" />
      <!-- Chalk tip -->
      <rect x="-1" y="-2" width="4" height="4" rx="1" fill="#38bdf8" />
      <!-- Ferrite tip band -->
      <rect x="-5" y="-2.2" width="4" height="4.4" fill="#ffffff" />
    </g>
  </g>
</svg>
