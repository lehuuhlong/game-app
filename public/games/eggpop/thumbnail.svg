<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="egg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="40%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Shell Base Gradient -->
    <radialGradient id="shell-base" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f7f5ee"/>
      <stop offset="85%" stop-color="#e2dfd6"/>
      <stop offset="100%" stop-color="#a8a29e"/>
    </radialGradient>

    <!-- 3D Spherical Volume Overlay -->
    <radialGradient id="egg-shade" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>

    <!-- Spot Gradients -->
    <radialGradient id="spot-red" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="45%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <radialGradient id="spot-blue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </radialGradient>
    <radialGradient id="spot-green" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="45%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <radialGradient id="spot-yellow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#a16207"/>
    </radialGradient>
    <radialGradient id="spot-purple" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </radialGradient>
    <radialGradient id="spot-orange" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>

    <!-- Cannon Barrel Gradient -->
    <linearGradient id="cannon-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Clip Path for Egg (Radius 14) -->
    <clipPath id="egg-clip">
      <circle cx="0" cy="0" r="14"/>
    </clipPath>

    <!-- Reusable Spotted Egg Definitions -->
    <g id="egg-red">
      <g clip-path="url(#egg-clip)">
        <circle cx="0" cy="0" r="14" fill="url(#shell-base)"/>
        <!-- Spots -->
        <circle cx="0" cy="0" r="4.2" fill="url(#spot-red)" stroke="#7f1d1d" stroke-width="0.5"/>
        <circle cx="6.5" cy="-1.5" r="3.4" fill="url(#spot-red)" stroke="#7f1d1d" stroke-width="0.5"/>
        <circle cx="3.2" cy="5.8" r="3.4" fill="url(#spot-red)" stroke="#7f1d1d" stroke-width="0.5"/>
        <circle cx="-3.2" cy="5.8" r="3.4" fill="url(#spot-red)" stroke="#7f1d1d" stroke-width="0.5"/>
        <circle cx="-6.5" cy="-1.5" r="3.4" fill="url(#spot-red)" stroke="#7f1d1d" stroke-width="0.5"/>
        <circle cx="-3.2" cy="-6" r="3.4" fill="url(#spot-red)" stroke="#7f1d1d" stroke-width="0.5"/>
        <circle cx="3.2" cy="-6" r="3.4" fill="url(#spot-red)" stroke="#7f1d1d" stroke-width="0.5"/>
        <circle cx="11" cy="4" r="3.4" fill="url(#spot-red)"/>
        <circle cx="8" cy="10" r="3.4" fill="url(#spot-red)"/>
        <circle cx="0" cy="12" r="3.4" fill="url(#spot-red)"/>
        <circle cx="-8" cy="10" r="3.4" fill="url(#spot-red)"/>
        <circle cx="-11" cy="4" r="3.4" fill="url(#spot-red)"/>
        <circle cx="-11" cy="-6" r="3.4" fill="url(#spot-red)"/>
        <circle cx="0" cy="-12" r="3.4" fill="url(#spot-red)"/>
        <circle cx="11" cy="-6" r="3.4" fill="url(#spot-red)"/>
        <circle cx="0" cy="0" r="14" fill="url(#egg-shade)"/>
        <ellipse cx="-4.5" cy="-4.5" rx="3.6" ry="2.2" transform="rotate(-45 -4.5 -4.5)" fill="white" opacity="0.75"/>
      </g>
      <circle cx="0" cy="0" r="14" stroke="#1e293b" stroke-width="1"/>
    </g>

    <g id="egg-blue">
      <g clip-path="url(#egg-clip)">
        <circle cx="0" cy="0" r="14" fill="url(#shell-base)"/>
        <circle cx="0" cy="0" r="4.2" fill="url(#spot-blue)" stroke="#172554" stroke-width="0.5"/>
        <circle cx="6.5" cy="-1.5" r="3.4" fill="url(#spot-blue)" stroke="#172554" stroke-width="0.5"/>
        <circle cx="3.2" cy="5.8" r="3.4" fill="url(#spot-blue)" stroke="#172554" stroke-width="0.5"/>
        <circle cx="-3.2" cy="5.8" r="3.4" fill="url(#spot-blue)" stroke="#172554" stroke-width="0.5"/>
        <circle cx="-6.5" cy="-1.5" r="3.4" fill="url(#spot-blue)" stroke="#172554" stroke-width="0.5"/>
        <circle cx="-3.2" cy="-6" r="3.4" fill="url(#spot-blue)" stroke="#172554" stroke-width="0.5"/>
        <circle cx="3.2" cy="-6" r="3.4" fill="url(#spot-blue)" stroke="#172554" stroke-width="0.5"/>
        <circle cx="11" cy="4" r="3.4" fill="url(#spot-blue)"/>
        <circle cx="8" cy="10" r="3.4" fill="url(#spot-blue)"/>
        <circle cx="0" cy="12" r="3.4" fill="url(#spot-blue)"/>
        <circle cx="-8" cy="10" r="3.4" fill="url(#spot-blue)"/>
        <circle cx="-11" cy="4" r="3.4" fill="url(#spot-blue)"/>
        <circle cx="-11" cy="-6" r="3.4" fill="url(#spot-blue)"/>
        <circle cx="0" cy="-12" r="3.4" fill="url(#spot-blue)"/>
        <circle cx="11" cy="-6" r="3.4" fill="url(#spot-blue)"/>
        <circle cx="0" cy="0" r="14" fill="url(#egg-shade)"/>
        <ellipse cx="-4.5" cy="-4.5" rx="3.6" ry="2.2" transform="rotate(-45 -4.5 -4.5)" fill="white" opacity="0.75"/>
      </g>
      <circle cx="0" cy="0" r="14" stroke="#1e293b" stroke-width="1"/>
    </g>

    <g id="egg-green">
      <g clip-path="url(#egg-clip)">
        <circle cx="0" cy="0" r="14" fill="url(#shell-base)"/>
        <circle cx="0" cy="0" r="4.2" fill="url(#spot-green)" stroke="#14532d" stroke-width="0.5"/>
        <circle cx="6.5" cy="-1.5" r="3.4" fill="url(#spot-green)" stroke="#14532d" stroke-width="0.5"/>
        <circle cx="3.2" cy="5.8" r="3.4" fill="url(#spot-green)" stroke="#14532d" stroke-width="0.5"/>
        <circle cx="-3.2" cy="5.8" r="3.4" fill="url(#spot-green)" stroke="#14532d" stroke-width="0.5"/>
        <circle cx="-6.5" cy="-1.5" r="3.4" fill="url(#spot-green)" stroke="#14532d" stroke-width="0.5"/>
        <circle cx="-3.2" cy="-6" r="3.4" fill="url(#spot-green)" stroke="#14532d" stroke-width="0.5"/>
        <circle cx="3.2" cy="-6" r="3.4" fill="url(#spot-green)" stroke="#14532d" stroke-width="0.5"/>
        <circle cx="11" cy="4" r="3.4" fill="url(#spot-green)"/>
        <circle cx="8" cy="10" r="3.4" fill="url(#spot-green)"/>
        <circle cx="0" cy="12" r="3.4" fill="url(#spot-green)"/>
        <circle cx="-8" cy="10" r="3.4" fill="url(#spot-green)"/>
        <circle cx="-11" cy="4" r="3.4" fill="url(#spot-green)"/>
        <circle cx="-11" cy="-6" r="3.4" fill="url(#spot-green)"/>
        <circle cx="0" cy="-12" r="3.4" fill="url(#spot-green)"/>
        <circle cx="11" cy="-6" r="3.4" fill="url(#spot-green)"/>
        <circle cx="0" cy="0" r="14" fill="url(#egg-shade)"/>
        <ellipse cx="-4.5" cy="-4.5" rx="3.6" ry="2.2" transform="rotate(-45 -4.5 -4.5)" fill="white" opacity="0.75"/>
      </g>
      <circle cx="0" cy="0" r="14" stroke="#1e293b" stroke-width="1"/>
    </g>

    <g id="egg-yellow">
      <g clip-path="url(#egg-clip)">
        <circle cx="0" cy="0" r="14" fill="url(#shell-base)"/>
        <circle cx="0" cy="0" r="4.2" fill="url(#spot-yellow)" stroke="#854d0e" stroke-width="0.5"/>
        <circle cx="6.5" cy="-1.5" r="3.4" fill="url(#spot-yellow)" stroke="#854d0e" stroke-width="0.5"/>
        <circle cx="3.2" cy="5.8" r="3.4" fill="url(#spot-yellow)" stroke="#854d0e" stroke-width="0.5"/>
        <circle cx="-3.2" cy="5.8" r="3.4" fill="url(#spot-yellow)" stroke="#854d0e" stroke-width="0.5"/>
        <circle cx="-6.5" cy="-1.5" r="3.4" fill="url(#spot-yellow)" stroke="#854d0e" stroke-width="0.5"/>
        <circle cx="-3.2" cy="-6" r="3.4" fill="url(#spot-yellow)" stroke="#854d0e" stroke-width="0.5"/>
        <circle cx="3.2" cy="-6" r="3.4" fill="url(#spot-yellow)" stroke="#854d0e" stroke-width="0.5"/>
        <circle cx="11" cy="4" r="3.4" fill="url(#spot-yellow)"/>
        <circle cx="8" cy="10" r="3.4" fill="url(#spot-yellow)"/>
        <circle cx="0" cy="12" r="3.4" fill="url(#spot-yellow)"/>
        <circle cx="-8" cy="10" r="3.4" fill="url(#spot-yellow)"/>
        <circle cx="-11" cy="4" r="3.4" fill="url(#spot-yellow)"/>
        <circle cx="-11" cy="-6" r="3.4" fill="url(#spot-yellow)"/>
        <circle cx="0" cy="-12" r="3.4" fill="url(#spot-yellow)"/>
        <circle cx="11" cy="-6" r="3.4" fill="url(#spot-yellow)"/>
        <circle cx="0" cy="0" r="14" fill="url(#egg-shade)"/>
        <ellipse cx="-4.5" cy="-4.5" rx="3.6" ry="2.2" transform="rotate(-45 -4.5 -4.5)" fill="white" opacity="0.75"/>
      </g>
      <circle cx="0" cy="0" r="14" stroke="#1e293b" stroke-width="1"/>
    </g>

    <g id="egg-purple">
      <g clip-path="url(#egg-clip)">
        <circle cx="0" cy="0" r="14" fill="url(#shell-base)"/>
        <circle cx="0" cy="0" r="4.2" fill="url(#spot-purple)" stroke="#581c87" stroke-width="0.5"/>
        <circle cx="6.5" cy="-1.5" r="3.4" fill="url(#spot-purple)" stroke="#581c87" stroke-width="0.5"/>
        <circle cx="3.2" cy="5.8" r="3.4" fill="url(#spot-purple)" stroke="#581c87" stroke-width="0.5"/>
        <circle cx="-3.2" cy="5.8" r="3.4" fill="url(#spot-purple)" stroke="#581c87" stroke-width="0.5"/>
        <circle cx="-6.5" cy="-1.5" r="3.4" fill="url(#spot-purple)" stroke="#581c87" stroke-width="0.5"/>
        <circle cx="-3.2" cy="-6" r="3.4" fill="url(#spot-purple)" stroke="#581c87" stroke-width="0.5"/>
        <circle cx="3.2" cy="-6" r="3.4" fill="url(#spot-purple)" stroke="#581c87" stroke-width="0.5"/>
        <circle cx="11" cy="4" r="3.4" fill="url(#spot-purple)"/>
        <circle cx="8" cy="10" r="3.4" fill="url(#spot-purple)"/>
        <circle cx="0" cy="12" r="3.4" fill="url(#spot-purple)"/>
        <circle cx="-8" cy="10" r="3.4" fill="url(#spot-purple)"/>
        <circle cx="-11" cy="4" r="3.4" fill="url(#spot-purple)"/>
        <circle cx="-11" cy="-6" r="3.4" fill="url(#spot-purple)"/>
        <circle cx="0" cy="-12" r="3.4" fill="url(#spot-purple)"/>
        <circle cx="11" cy="-6" r="3.4" fill="url(#spot-purple)"/>
        <circle cx="0" cy="0" r="14" fill="url(#egg-shade)"/>
        <ellipse cx="-4.5" cy="-4.5" rx="3.6" ry="2.2" transform="rotate(-45 -4.5 -4.5)" fill="white" opacity="0.75"/>
      </g>
      <circle cx="0" cy="0" r="14" stroke="#1e293b" stroke-width="1"/>
    </g>

    <g id="egg-orange">
      <g clip-path="url(#egg-clip)">
        <circle cx="0" cy="0" r="14" fill="url(#shell-base)"/>
        <circle cx="0" cy="0" r="4.2" fill="url(#spot-orange)" stroke="#7c2d12" stroke-width="0.5"/>
        <circle cx="6.5" cy="-1.5" r="3.4" fill="url(#spot-orange)" stroke="#7c2d12" stroke-width="0.5"/>
        <circle cx="3.2" cy="5.8" r="3.4" fill="url(#spot-orange)" stroke="#7c2d12" stroke-width="0.5"/>
        <circle cx="-3.2" cy="5.8" r="3.4" fill="url(#spot-orange)" stroke="#7c2d12" stroke-width="0.5"/>
        <circle cx="-6.5" cy="-1.5" r="3.4" fill="url(#spot-orange)" stroke="#7c2d12" stroke-width="0.5"/>
        <circle cx="-3.2" cy="-6" r="3.4" fill="url(#spot-orange)" stroke="#7c2d12" stroke-width="0.5"/>
        <circle cx="3.2" cy="-6" r="3.4" fill="url(#spot-orange)" stroke="#7c2d12" stroke-width="0.5"/>
        <circle cx="11" cy="4" r="3.4" fill="url(#spot-orange)"/>
        <circle cx="8" cy="10" r="3.4" fill="url(#spot-orange)"/>
        <circle cx="0" cy="12" r="3.4" fill="url(#spot-orange)"/>
        <circle cx="-8" cy="10" r="3.4" fill="url(#spot-orange)"/>
        <circle cx="-11" cy="4" r="3.4" fill="url(#spot-orange)"/>
        <circle cx="-11" cy="-6" r="3.4" fill="url(#spot-orange)"/>
        <circle cx="0" cy="-12" r="3.4" fill="url(#spot-orange)"/>
        <circle cx="11" cy="-6" r="3.4" fill="url(#spot-orange)"/>
        <circle cx="0" cy="0" r="14" fill="url(#egg-shade)"/>
        <ellipse cx="-4.5" cy="-4.5" rx="3.6" ry="2.2" transform="rotate(-45 -4.5 -4.5)" fill="white" opacity="0.75"/>
      </g>
      <circle cx="0" cy="0" r="14" stroke="#1e293b" stroke-width="1"/>
    </g>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="28" fill="url(#egg-bg)"/>

  <!-- Subtle Hex Grid Lines -->
  <g stroke="#134e4a" stroke-width="0.8" opacity="0.35">
    <line x1="20" y1="0" x2="20" y2="200"/>
    <line x1="50" y1="0" x2="50" y2="200"/>
    <line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="110" y1="0" x2="110" y2="200"/>
    <line x1="140" y1="0" x2="140" y2="200"/>
    <line x1="170" y1="0" x2="170" y2="200"/>
    <line x1="0" y1="30" x2="200" y2="30"/>
    <line x1="0" y1="60" x2="200" y2="60"/>
    <line x1="0" y1="90" x2="200" y2="90"/>
    <line x1="0" y1="120" x2="200" y2="120"/>
  </g>

  <!-- Top Hex Rows of Colorful Spotted Dino Eggs -->
  <!-- Row 0 (Even) -->
  <g transform="translate(25, 24)"><use href="#egg-red"/></g>
  <g transform="translate(55, 24)"><use href="#egg-blue"/></g>
  <g transform="translate(85, 24)"><use href="#egg-green"/></g>
  <g transform="translate(115, 24)"><use href="#egg-yellow"/></g>
  <g transform="translate(145, 24)"><use href="#egg-purple"/></g>
  <g transform="translate(175, 24)"><use href="#egg-orange"/></g>

  <!-- Row 1 (Odd - Offset) -->
  <g transform="translate(40, 50)"><use href="#egg-yellow"/></g>
  <g transform="translate(70, 50)"><use href="#egg-purple"/></g>
  <g transform="translate(100, 50)"><use href="#egg-red"/></g>
  <g transform="translate(130, 50)"><use href="#egg-green"/></g>
  <g transform="translate(160, 50)"><use href="#egg-blue"/></g>

  <!-- Row 2 (Even - Clusters) -->
  <g transform="translate(25, 76)"><use href="#egg-blue"/></g>
  <g transform="translate(55, 76)"><use href="#egg-orange"/></g>
  <g transform="translate(85, 76)"><use href="#egg-orange"/></g>
  <g transform="translate(115, 76)"><use href="#egg-orange"/></g>
  <g transform="translate(145, 76)"><use href="#egg-yellow"/></g>
  <g transform="translate(175, 76)"><use href="#egg-red"/></g>

  <!-- Row 3 (Hanging pop cluster) -->
  <g transform="translate(100, 102)"><use href="#egg-orange"/></g>

  <!-- Starburst Sparkles around matching cluster -->
  <g>
    <circle cx="85" cy="76" r="18" stroke="#fdba74" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
    <polygon points="100,68 102,74 108,76 102,78 100,84 98,78 92,76 98,74" fill="#fef08a"/>
    <polygon points="120,95 121,98 124,99 121,100 120,103 119,100 116,99 119,98" fill="#67e8f9"/>
    <polygon points="68,95 69,98 72,99 69,100 68,103 67,100 64,99 67,98" fill="#f472b6"/>
  </g>

  <!-- Flying Egg with Motion Streaks -->
  <g opacity="0.9">
    <line x1="100" y1="165" x2="100" y2="128" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
    <g transform="translate(100, 124)"><use href="#egg-orange"/></g>
  </g>

  <!-- Shooter Cannon Platform -->
  <ellipse cx="100" cy="182" rx="36" ry="12" fill="#1e293b" stroke="#0f766e" stroke-width="2"/>
  
  <!-- Arrow Launcher Barrel -->
  <g transform="translate(100, 175) rotate(-90)">
    <rect x="-5" y="-6" width="22" height="12" rx="3" fill="url(#cannon-grad)" stroke="#0284c7" stroke-width="1.5"/>
    <polygon points="17,-9 27,0 17,9" fill="#7dd3fc" stroke="#0284c7" stroke-width="1.5"/>
  </g>

  <!-- Loaded Egg on Shooter -->
  <g transform="translate(100, 175) scale(0.85)"><use href="#egg-orange"/></g>

  <!-- Next Preview Egg -->
  <g transform="translate(136, 180) scale(0.6)"><use href="#egg-green"/></g>
</svg>
