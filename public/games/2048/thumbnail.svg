<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 224" fill="none">
  <defs>
    <linearGradient id="bg2048" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="tile2048" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="tile1024" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="tile512" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="tile256" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="384" height="224" fill="url(#bg2048)" />

  <!-- Ambient Glow -->
  <circle cx="192" cy="112" r="100" fill="#f59e0b" fill-opacity="0.15" />
  <circle cx="280" cy="112" r="80" fill="#ec4899" fill-opacity="0.12" />

  <!-- 4x3 Showcase Grid Board -->
  <rect x="52" y="24" width="280" height="176" rx="16" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="3" />

  <!-- Tiles Grid -->
  <!-- Row 1 -->
  <rect x="66" y="38" width="56" height="46" rx="8" fill="#334155" />
  <text x="94" y="66" fill="#cbd5e1" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle" dominant-baseline="middle">64</text>

  <rect x="130" y="38" width="56" height="46" rx="8" fill="#475569" />
  <text x="158" y="66" fill="#f1f5f9" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle" dominant-baseline="middle">128</text>

  <rect x="194" y="38" width="56" height="46" rx="8" fill="url(#tile256)" stroke="#a78bfa" stroke-width="1.5" />
  <text x="222" y="66" fill="white" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle" dominant-baseline="middle">256</text>

  <rect x="258" y="38" width="56" height="46" rx="8" fill="url(#tile512)" stroke="#f472b6" stroke-width="1.5" />
  <text x="286" y="66" fill="white" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle" dominant-baseline="middle">512</text>

  <!-- Row 2 -->
  <rect x="66" y="90" width="56" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="94" y="118" fill="#94a3b8" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle" dominant-baseline="middle">32</text>

  <rect x="130" y="90" width="56" height="46" rx="8" fill="url(#tile1024)" stroke="#fb923c" stroke-width="2" />
  <text x="158" y="118" fill="white" font-family="sans-serif" font-weight="900" font-size="17" text-anchor="middle" dominant-baseline="middle">1024</text>

  <!-- Golden Glowing 2048 Master Tile -->
  <g transform="translate(194, 90)">
    <rect x="0" y="0" width="120" height="46" rx="10" fill="url(#tile2048)" stroke="#fef08a" stroke-width="2.5" />
    <text x="60" y="28" fill="#451a03" font-family="sans-serif" font-weight="900" font-size="22" text-anchor="middle" dominant-baseline="middle">2048</text>
    <!-- Sparkles -->
    <polygon points="10,8 12,14 18,16 12,18 10,24 8,18 2,16 8,14" fill="#ffffff" />
    <polygon points="106,30 107.5,34 112,35 107.5,36 106,40 104.5,36 100,35 104.5,34" fill="#ffffff" />
  </g>

  <!-- Row 3 -->
  <rect x="66" y="142" width="56" height="46" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="94" y="170" fill="#64748b" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle" dominant-baseline="middle">2</text>

  <rect x="130" y="142" width="56" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="158" y="170" fill="#94a3b8" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle" dominant-baseline="middle">4</text>

  <rect x="194" y="142" width="56" height="46" rx="8" fill="#334155" stroke="#475569" stroke-width="1" />
  <text x="222" y="170" fill="#cbd5e1" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle" dominant-baseline="middle">8</text>

  <rect x="258" y="142" width="56" height="46" rx="8" fill="#475569" stroke="#64748b" stroke-width="1" />
  <text x="286" y="170" fill="#e2e8f0" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle" dominant-baseline="middle">16</text>
</svg>
