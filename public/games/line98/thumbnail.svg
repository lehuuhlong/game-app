  </defs>
  <rect width="200" height="200" rx="24" fill="url(#bg)"/>
  <!-- Grid -->
  <g stroke="#fff" stroke-width="0.5" opacity="0.08">
    <line x1="40" y1="40" x2="40" y2="160"/><line x1="70" y1="40" x2="70" y2="160"/>
    <line x1="100" y1="40" x2="100" y2="160"/><line x1="130" y1="40" x2="130" y2="160"/>
    <line x1="160" y1="40" x2="160" y2="160"/>
    <line x1="40" y1="40" x2="160" y2="40"/><line x1="40" y1="70" x2="160" y2="70"/>
    <line x1="40" y1="100" x2="160" y2="100"/><line x1="40" y1="130" x2="160" y2="130"/>
    <line x1="40" y1="160" x2="160" y2="160"/>
  </g>
  <!-- Balls -->
  <circle cx="55" cy="55" r="12" fill="#ef4444"/><circle cx="55" cy="55" r="12" fill="url(#g)"/>
  <circle cx="85" cy="85" r="12" fill="#3b82f6"/><circle cx="85" cy="85" r="12" fill="url(#g)"/>
  <circle cx="115" cy="55" r="12" fill="#22c55e"/><circle cx="115" cy="55" r="12" fill="url(#g)"/>
  <circle cx="145" cy="115" r="12" fill="#eab308"/><circle cx="145" cy="115" r="12" fill="url(#g)"/>
  <!-- Row of 5 purple -->
  <circle cx="55" cy="145" r="11" fill="#a855f7"/><circle cx="55" cy="145" r="11" fill="url(#g)"/>
  <circle cx="85" cy="145" r="11" fill="#a855f7"/><circle cx="85" cy="145" r="11" fill="url(#g)"/>
  <circle cx="115" cy="145" r="11" fill="#a855f7"/><circle cx="115" cy="145" r="11" fill="url(#g)"/>
  <circle cx="145" cy="145" r="11" fill="#a855f7"/><circle cx="145" cy="145" r="11" fill="url(#g)"/>
  <circle cx="55" cy="115" r="12" fill="#06b6d4"/><circle cx="55" cy="115" r="12" fill="url(#g)"/>
  <!-- Match line -->
  <line x1="44" y1="145" x2="156" y2="145" stroke="#c084fc" stroke-width="2" opacity="0.5" stroke-dasharray="4 2"/>
